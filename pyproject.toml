[project]
name = "smtp-test"
version = "0.1.0"
description = "Terminal SMTP configuration diagnostics and email testing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dnspython>=2.9.2",
    "textual>=8.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
smtp-test = "smtp_test.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
